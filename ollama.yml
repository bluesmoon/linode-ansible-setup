- name: Install ollama
  hosts: all

  vars_files:
    - group_vars/vars
    - group_vars/secret_vars

  roles:
    - ollama

    # From https://github.com/morgangraphics/ansible-role-nvm/
    - role: nvm
      become: true
      become_user: "{{ sudo_username }}"
      nvm_commands:
        - "npx --yes skills add MemPalace/mempalace --yes"
