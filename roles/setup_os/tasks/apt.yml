- name: Apt update cache
  ansible.builtin.apt:
    update_cache: yes

- name: Update grub on Ubuntu 26.04+ or Debian 13+
  when:
    - (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] is version('26.04', '>=')) or
      (ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_version'] is version('13', '>='))
  ansible.builtin.script:
    cmd: fix-grub.sh
    creates: /.grub_updated

- name: Apt upgrade packages
  ansible.builtin.apt:
    upgrade: safe

- name: Install basic packages
  ansible.builtin.apt:
    pkg:
      - chrony
      - curl
      - htop
      - rsync
      - python3
      - python3-passlib
      - acl
    state: present
  register: setup_os_package_updates
