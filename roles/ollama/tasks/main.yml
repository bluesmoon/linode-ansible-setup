# Based on https://wiki.linux-server-admin.com/web-apps/genai/ollama/setup/ansible

- name: GPU Dependencies
  ansible.builtin.include_tasks: gpu-deps.yml
  when: ollama_enable_gpu

# ====================
# Create Application User
# ====================
- name: Create Ollama group
  ansible.builtin.group:
    name: "{{ ollama_app_group }}"
    state: present

- name: Create Ollama user
  ansible.builtin.user:
    name: "{{ ollama_app_user }}"
    group: "{{ ollama_app_group }}"
    shell: /bin/bash
    system: false
    create_home: true
    home: /home/ollama

- name: Create models directory
  ansible.builtin.file:
    path: "{{ ollama_models_dir }}"
    state: directory
    owner: "{{ ollama_app_user }}"
    group: "{{ ollama_app_group }}"
    mode: "0755"


- name: Fetch ollama install script
  ansible.builtin.get_url:
    url: https://ollama.com/install.sh
    checksum: sha1:541dfb37e1cad403739e42376f9faa24a1b607e0
    dest: /tmp/ollama_install.sh
    mode: '0755'

- name: Install Ollama (official script)
  ansible.builtin.command: /tmp/ollama_install.sh
  environment:
    OLLAMA_VERSION: "{{ ollama_version }}"
  register: ollama_install_result
  changed_when: "'installed' in ollama_install_result.stdout or 'Updated' in ollama_install_result.stdout"
  failed_when: ollama_install_result.rc != 0 and 'already installed' not in ollama_install_result.stderr


# ====================
# Configure Ollama Environment
# ====================
- name: Create Ollama environment directory
  ansible.builtin.file:
    path: /etc/ollama
    state: directory
    mode: "0755"

- name: Create Ollama environment file
  ansible.builtin.copy:
    dest: /etc/ollama/ollama.env
    mode: "0644"
    content: |
      # Ollama Environment Variables
      # Generated by Ansible

      # Server binding
      OLLAMA_HOST={{ ollama_host }}:{{ ollama_app_port }}

      # Origins (CORS)
      OLLAMA_ORIGINS={{ ollama_origins }}

      # Debug mode
      OLLAMA_DEBUG={{ ollama_debug | lower }}

      # Keep alive time for models in memory
      OLLAMA_KEEP_ALIVE={{ ollama_keep_alive }}

      # Models directory
      OLLAMA_MODELS={{ ollama_models_dir }}

      # GPU settings
      {% if ollama_enable_gpu and ollama_gpu_type == "nvidia" %}
      NVIDIA_VISIBLE_DEVICES=all
      {% endif %}
      {% if ollama_enable_gpu and ollama_gpu_type == "amd" %}
      HSA_OVERRIDE_GFX_VERSION=11.0.0
      {% endif %}

# ====================
# Update Systemd Service
# ====================
- name: Create Ollama systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/ollama.service
    mode: "0644"
    content: |
      [Unit]
      Description=Ollama Service
      After=network-online.target

      [Service]
      Type=exec
      User={{ ollama_app_user }}
      Group={{ ollama_app_group }}
      EnvironmentFile=/etc/ollama/ollama.env
      ExecStart=/usr/local/bin/ollama serve
      Restart=always
      RestartSec=10
      LimitNOFILE=65535
      LimitMEMLOCK=infinity
      {% if ollama_enable_gpu %}
      Environment="NVIDIA_VISIBLE_DEVICES=all"
      {% endif %}

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start Ollama
  ansible.builtin.systemd:
    name: ollama
    enabled: true
    state: started


# ====================
# Pre-download Models (Optional)
# ====================
- name: Wait for Ollama to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ ollama_app_port }}/api/tags"
    method: GET
    status_code: 200
  register: ollama_health_check
  retries: 30
  delay: 10
  until: ollama_health_check.status == 200
  failed_when: false

- name: Pre-download Ollama models
  ansible.builtin.command: "/usr/local/bin/ollama pull {{ item }}"
  with_items: "{{ ollama_models }}"
  become: true
  become_user: "{{ ollama_app_user }}"
  environment:
    OLLAMA_MODELS: "{{ ollama_models_dir }}"
  register: ollama_pull_result
  changed_when: "'already exists' not in ollama_pull_result.stdout"
