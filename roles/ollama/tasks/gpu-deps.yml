# ====================
# GPU Dependencies (Optional)
# ====================
- name: Install NVIDIA CUDA toolkit
  ansible.builtin.apt:
    name:
      - nvidia-cuda-toolkit
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - ollama_gpu_type == "nvidia"
  failed_when: false

- name: Install NVIDIA driver (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - nvidia-driver-535
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - ollama_gpu_type == "nvidia"
  failed_when: false

- name: Install ROCm (AMD GPU)
  ansible.builtin.apt:
    name:
      - rocm-libs
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - ollama_gpu_type == "amd"
  failed_when: false
