# Wait for ssh
- name: Wait for port 22 to become open
  ansible.builtin.wait_for:
    port: 22
    host: '{{ inventory_hostname }}'
    search_regex: OpenSSH
    delay: 10
  connection: local

- name: Scan host keys and fingerprints (RFC4255)
  ansible.builtin.shell:
    cmd: "ssh-keyscan -q -T 10 {% for host in groups['all'] %}{{ hostvars[host]['ansible_host'] }} {% endfor %} 2>/dev/null"
  connection: local
  run_once: true
  register: wait_for_ssh_hostkeys
  changed_when: false

- name: Add host keys to known_hosts
  ansible.builtin.known_hosts:
    name: "{{ item.split()[0] }}"
    key: "{{ item }}"
    state: present
    path: ~/.ssh/known_hosts
  loop: "{{ wait_for_ssh_hostkeys.stdout_lines }}"
  connection: local
  run_once: true

- name: Generate SSHFP records from hosts
  ansible.builtin.shell:
    cmd: "ssh-keyscan -q -D -T 10 {% for host in groups['all'] %}{{ hostvars[host]['ansible_host'] }} {% endfor %} 2>/dev/null"
  connection: local
  run_once: true
  register: wait_for_ssh_sshfp_records
  changed_when: false

- name: Add SSHFP records to DNS (RFC4255)
  linode.cloud.domain_record:
    api_token: '{{ api_token }}'
    domain_id: '{{ linode_dns_domain_info.domain.id }}'
    name: '{{ sshfp_record.split()[0] }}'
    target: '{{ sshfp_record }}'
    ttl_sec: '{{ ttl_sec | default(omit) }}'
    type: 'SSHFP'
    state: present
  vars:
    linode_dns_domain_info: "{{ hostvars['localhost'].get('linode_dns_domain_info', {}) }}"
  loop: "{{ wait_for_ssh_sshfp_records.stdout_lines | d([]) }}"
  loop_control:
    loop_var: sshfp_record
  connection: local
  run_once: true
  when:
    - domain_name is defined
    - domain_name | d('', true) != ''
    - domain_service is not defined or domain_service | d('linode', true) == 'linode'
    - wait_for_ssh_sshfp_records.stdout_lines | d([]) | length > 0
    - hostvars['localhost'].get('linode_dns_domain_info', {}) | d([]) | length > 0
  failed_when:
    - wait_for_ssh_sshfp_result is failed
    - "'invalid domain id' not in wait_for_ssh_sshfp_result.msg | d('')"
  register: wait_for_ssh_sshfp_result

- name: Gather facts about the hosts
  ansible.builtin.setup:
